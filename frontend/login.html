<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Garment Tracker Production System</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page-body">

  <div class="login-card-wrap">
    <div class="login-card">
      <div class="login-logo-center">
        <div class="login-brand-icon">
          <i class="fa-solid fa-shirt"></i>
        </div>
        <h1 class="login-title">Garment Tracker</h1>
        <p class="login-subtitle">Production Tracking System</p>
      </div>

      <div style="margin-bottom: 24px;">
        <h2 style="font-size: 18px; font-weight: 700; color: var(--text-dark);">Welcome Back 👋</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Sign in to your manufacturing account</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Staff ID <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="login-username" class="form-control" placeholder="admin" value="admin" required>
          </div>
          <div id="username-error" class="invalid-feedback">Please enter your username.</div>
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label class="form-label" for="login-password">Password <span class="required">*</span></label>
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="admin123" required>
          </div>
          <div id="password-error" class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <div class="login-options-row">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="remember-me" checked>
            <span class="form-check-label">Remember Me</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Demo reset instructions sent to registered system administrator email.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="demo-credentials-box">
        <strong><i class="fa-solid fa-circle-info"></i> Demo Credentials:</strong><br>
        Role: <span style="font-weight:600;">System Administrator</span><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('login-username');
      const passwordInput = document.getElementById('login-password');
      let isValid = true;

      if (!usernameInput.value.trim()) {
        usernameInput.classList.add('is-invalid');
        isValid = false;
      } else {
        usernameInput.classList.remove('is-invalid');
      }

      if (!passwordInput.value || passwordInput.value.length < 6) {
        passwordInput.classList.add('is-invalid');
        isValid = false;
      } else {
        passwordInput.classList.remove('is-invalid');
      }

      if (isValid) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      }
    });
  </script>
</body>
</html>
